##################mysql配置##################
# 所有敏感值均通过环境变量注入，切勿在此文件提交真实口令
mallchat.mysql.ip=${MALLCHAT_MYSQL_IP:127.0.0.1}
mallchat.mysql.port=${MALLCHAT_MYSQL_PORT:3306}
mallchat.mysql.db=${MALLCHAT_MYSQL_DB:mallchat}
mallchat.mysql.username=${MALLCHAT_MYSQL_USERNAME:root}
mallchat.mysql.password=${MALLCHAT_MYSQL_PASSWORD:}
##################redis配置##################
mallchat.redis.host=${MALLCHAT_REDIS_HOST:127.0.0.1}
mallchat.redis.port=${MALLCHAT_REDIS_PORT:6379}
mallchat.redis.password=${MALLCHAT_REDIS_PASSWORD:}
##################jwt##################
# 必须是长度 >= 32 的随机串
mallchat.jwt.secret=${MALLCHAT_JWT_SECRET:}
##################微信公众号信息##################
mallchat.wx.callback=${MALLCHAT_WX_CALLBACK:}
mallchat.wx.appId=${MALLCHAT_WX_APPID:}
mallchat.wx.secret=${MALLCHAT_WX_SECRET:}
# 接口配置里的Token值
mallchat.wx.token=${MALLCHAT_WX_TOKEN:}
# 接口配置里的EncodingAESKey值
mallchat.wx.aesKey=${MALLCHAT_WX_AES_KEY:}
##################OSS配置##################
oss.enabled=true
oss.type=minio
oss.endpoint=${MALLCHAT_OSS_ENDPOINT:http://localhost:9000}
oss.access-key=${MALLCHAT_OSS_ACCESS_KEY:}
oss.secret-key=${MALLCHAT_OSS_SECRET_KEY:}
oss.bucketName=${MALLCHAT_OSS_BUCKET:default}
##################rocketmq##################
rocketmq.name-server=${MALLCHAT_RMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.access-key=${MALLCHAT_RMQ_ACCESS_KEY:}
rocketmq.secret-key=${MALLCHAT_RMQ_SECRET_KEY:}
##################gpt配置##################
mallchat.chatgpt.use=false
mallchat.chatgpt.uid=10001
mallchat.chatgpt.key=${MALLCHAT_CHATGPT_KEY:}
mallchat.chatgpt.proxyUrl=${MALLCHAT_CHATGPT_PROXY_URL:}
mallchat.chatglm2.use=false
mallchat.chatglm2.url=${MALLCHAT_CHATGLM2_URL:}
mallchat.chatglm2.uid=10002
mallchat.chatglm2.context=3
