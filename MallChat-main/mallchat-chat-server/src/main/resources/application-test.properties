server.port=8080
##################mysql##################
mallchat.mysql.ip=127.0.0.1
mallchat.mysql.port=3306
mallchat.mysql.db=mallchat
mallchat.mysql.username=root
# TODO: 改成你自己的 MySQL 密码
mallchat.mysql.password=your-mysql-password
##################redis##################
mallchat.redis.host=127.0.0.1
mallchat.redis.port=6379
mallchat.redis.password=
##################jwt##################
# TODO: 改成你自己的随机串
mallchat.jwt.secret=your-jwt-secret
##################微信公众号（接口测试号）##################
# 内网穿透域名：必须与测试号「接口配置信息 URL」及「网页授权域名」保持一致。
# 本地开发建议用 cpolar / ngrok 等工具，免费版域名会变，记得三处同步改。
mallchat.wx.callback=https://your-tunnel-domain
# 申请一个微信接口测试号即可拿到 appId 与 secret
mallchat.wx.appId=your-appid
mallchat.wx.secret=your-secret
# Token：必须与「接口测试号 -> 接口配置信息」里填的 Token 完全一致，否则微信验签失败
mallchat.wx.token=mallchat
mallchat.wx.aesKey=
##################OSS##################
# oss.type=local -> 本地磁盘存储，无需外部服务；改 minio 则用 MinIO
oss.enabled=true
oss.type=local
# endpoint 同时被后端与浏览器使用，必须客户端可达
oss.endpoint=http://localhost:8080
oss.access-key=minioadmin
oss.secret-key=minioadmin
oss.bucketName=default
# 本地存储根目录，仅 oss.type=local 时生效，改成你自己的绝对路径
oss.localRoot=D:/your/path/oss-data
##################rocketmq##################
rocketmq.name-server=127.0.0.1:9876
rocketmq.access-key=root
rocketmq.secret-key=123456
##################AI chat##################
# proxyUrl 为 OpenAI 兼容服务的「根地址」(LangChain4j 会自行拼接 /chat/completions)。
# 写成完整地址 .../chat/completions 亦可（ChatModelConfig 会自动剥离后缀）
mallchat.chatgpt.use=true
mallchat.chatgpt.uid=10001
mallchat.chatgpt.key=sk-your-api-key
mallchat.chatgpt.proxyUrl=https://your-openai-compatible-host/v1
mallchat.chatgpt.modelName=deepseek-flash
mallchat.chatglm2.use=false
mallchat.chatglm2.url=http://your-chatglm2-host
mallchat.chatglm2.uid=10002
